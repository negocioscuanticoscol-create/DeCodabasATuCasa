<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · De CODABAS a tu Casa</title>
<style>
:root{
  --g:#34A853;--gd:#1B5E20;--gl:#7CB342;--or:#F07F1A;
  --bg:#eef3ea;--card:#fff;--tx:#1f2937;--tl:#6b7280;--bd:#e3e9dd;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--shadow:0 2px 16px rgba(27,94,32,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
h1,h2,h3,h4{margin:0}
.shell{display:flex;min-height:100vh}
/* SIDEBAR */
.side{width:230px;background:linear-gradient(180deg,var(--gd),#0f3d13);color:#fff;padding:18px 14px;flex:none;position:sticky;top:0;height:100vh}
.side .brandrow{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.side .lg{width:46px;height:46px;border-radius:12px;background:#fff;overflow:hidden;flex:none}
.side .lg img{width:100%;height:100%;object-fit:cover}
.side .bn{font-weight:800;font-size:15px;line-height:1.1}
.side .bn small{display:block;font-weight:500;opacity:.8;font-size:11px;margin-top:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;color:#dfeede;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:3px;text-align:left;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:#fff;color:var(--gd)}
.side .foot{position:absolute;bottom:16px;left:14px;right:14px;font-size:11px;opacity:.7}
/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--bd);padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.topbar h2{font-size:18px;color:var(--gd)}
.topbar .date{color:var(--tl);font-size:13px}
.topbar .sp{flex:1}
.btn{border:none;border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer}
.btn-g{background:var(--g);color:#fff}.btn-or{background:var(--or);color:#fff}.btn-gd{background:var(--gd);color:#fff}
.btn-ghost{background:#fff;border:1.5px solid var(--bd);color:var(--gd)}
.btn:active{transform:scale(.98)}
.wrap{padding:22px;max-width:1100px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.kpi .v{font-size:26px;font-weight:800;color:var(--gd)}
.kpi .l{font-size:12px;color:var(--tl);margin-top:2px;font-weight:600}
.kpi.or .v{color:var(--or)}
.kpi.gr .v{color:var(--g)}
/* CARDS */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{color:var(--gd);font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sub{border:1px solid var(--bd);border-radius:12px;padding:13px;margin:9px 0;background:#fafdf8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
label{display:block;font-size:12px;font-weight:700;color:var(--gd);margin:0 0 5px}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f3ed;gap:10px}
.li:last-child{border-bottom:none}
.muted{color:var(--tl)}
.tiny{font-size:11px;color:var(--tl)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
.pill-ok{background:#e7f6ec;color:var(--ok)}.pill-warn{background:#fef3e2;color:var(--warn)}
.pill-gray{background:#eef1ec;color:var(--tl)}.pill-or{background:#fdeede;color:var(--or)}.pill-bad{background:#fde8e8;color:var(--bad)}
.empty{text-align:center;color:var(--tl);padding:24px}
a.link{color:var(--g);font-weight:700;text-decoration:none}
.bar{height:10px;border-radius:6px;background:var(--g)}
.bartrack{background:#eef1ec;border-radius:6px;overflow:hidden;flex:1;margin:0 10px}
.tag{font-size:11px;font-weight:700;color:var(--gd);background:#eef7ea;padding:2px 8px;border-radius:6px}
/* MOBILE */
.mtabs{display:none}
@media(max-width:760px){
  .shell{display:block}
  .side{display:none}
  .topbar{padding:12px 14px}
  .wrap{padding:14px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .mtabs{display:flex;gap:6px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);padding:8px 10px;position:sticky;top:53px;z-index:4}
  .mtabs button{white-space:nowrap;border:none;background:#eef1ec;color:var(--tl);font-weight:700;padding:8px 12px;border-radius:999px;font-size:13px}
  .mtabs button.on{background:var(--g);color:#fff}
  .row2{grid-template-columns:1fr}
  .row3{grid-template-columns:1fr}
}
/* GATE */
#gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--gd),#0f3d13);display:flex;align-items:center;justify-content:center;z-index:50}
#gate .box{background:#fff;border-radius:20px;padding:28px;width:300px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#gate img{width:90px;height:90px;border-radius:20px;margin-bottom:12px}
</style>

const CAT_ORDER=['🥦 Verduras','🍎 Frutas','🥤 Pulpas','🥩 Carnes','🥛 Lácteos'];
async function syncData(){
  try{
    const [{data:profs},{data:subs},{data:ords},{data:prods}]=await Promise.all([
      sb.from('profiles').select('*'),
      sb.from('subscriptions').select('*').order('created_at',{ascending:false}),
      sb.from('orders').select('*, order_items(*), feedback(*)').order('created_at',{ascending:false}),
      sb.from('products').select('*').order('nombre')
    ]);
    const byId={}; (profs||[]).forEach(p=>byId[p.id]=p);
    const latestSub={}; (subs||[]).forEach(s=>{if(!latestSub[s.user_id])latestSub[s.user_id]=s;});
    const users={};
    (profs||[]).forEach(p=>{
      const s=latestSub[p.id];
      users[p.phone]={phone:p.phone,uid:p.id,nombre:p.nombre,apellidos:p.apellidos,role:p.role,
        firstOrderUsed:!!p.first_order_used,
        sub: s ? {active:(s.status==='activa'&&s.expires_at&&new Date(s.expires_at).getTime()>Date.now()),
                  pending:(s.status==='pendiente'),expires:(s.expires_at?new Date(s.expires_at).getTime():0),
                  id:s.id,status:s.status} : {active:false,pending:false}};
    });
    data.users=users;
    data.orders=(ords||[]).map(o=>{
      const pr=byId[o.user_id]; const fb=(o.feedback&&o.feedback.length)?o.feedback[0]:null;
      return {id:o.id,phone:pr?pr.phone:o.user_id,status:o.status,
        items:(o.order_items||[]).map(it=>({n:it.producto,qty:it.qty,u:it.unidad})),
        del:{localidad:o.localidad,barrio:o.barrio,dir:o.dir,apto:o.apto,ref:o.ref,
             coords:(o.lat!=null?{lat:o.lat,lng:o.lng}:null),mapsLink:o.maps_link},
        horario:o.horario,nota:o.nota,
        quote:(o.total_quoted!=null?{price:o.total_quoted,napa:o.napa}:null),
        facturaUrl:o.factura_url||null,
        feedback:(fb?{stars:fb.stars,text:fb.comment}:null),
        createdAt:o.created_at?new Date(o.created_at).getTime():Date.now()};
    });
    const cat={}; (prods||[]).forEach(r=>{const c=r.categoria||'Otros';(cat[c]=cat[c]||[]).push({n:r.nombre,u:r.unidad||'u',off:!r.activo,id:r.id,img:r.image_url||null});});
    const ordered={}; CAT_ORDER.forEach(c=>{if(cat[c])ordered[c]=cat[c];}); Object.keys(cat).forEach(c=>{if(!ordered[c])ordered[c]=cat[c];});
    if(Object.keys(ordered).length) data.catalog=ordered;
  }catch(e){console.warn('sync dashboard:',e);}
}

/* ---------- ruta: haversine + NN + 2-opt ---------- */
function haversine(a,b){const R=6371,r=x=>x*Math.PI/180,dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);const s=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));}
function rdist(start,seq){let t=0,c=start;for(const s of seq){t+=haversine(c,s);c=s;}return t;}
function nn(start,stops){const rem=stops.slice(),seq=[];let c=start;while(rem.length){let bi=0,bd=Infinity;rem.forEach((s,i)=>{const d=haversine(c,s);if(d<bd){bd=d;bi=i;}});c=rem[bi];seq.push(rem[bi]);rem.splice(bi,1);}return seq;}
function twoOpt(start,seq){let best=seq.slice(),bd=rdist(start,best),imp=true,g=0;while(imp&&g++<200){imp=false;for(let i=0;i<best.length-1;i++)for(let k=i+1;k<best.length;k++){const c=best.slice(0,i).concat(best.slice(i,k+1).reverse(),best.slice(k+1));const d=rdist(start,c);if(d<bd-1e-9){best=c;bd=d;imp=true;}}}return{route:best,total:bd};}
function optimize(start,stops){if(!stops.length)return{route:[],total:0};const{route,total}=twoOpt(start,nn(start,stops));let p=start;route.forEach(r=>{r.leg=haversine(p,r);p=r;});return{route,total};}

/* ---------- acceso del gestor (Supabase + rol manager) ---------- */
async function checkLogin(){
  const ph=($('phone').value||'').replace(/\D/g,''); const pw=$('pw').value; const err=$('pinerr');
  if(ph.length<10){err.textContent='Ingresa el celular del gestor.';return;}
  err.textContent='Entrando…';
  try{
    const {data:d,error}=await sb.auth.signInWithPassword({email:ph+'@codabas.app',password:pw});
    if(error||!d||!d.user){err.textContent='Celular o contraseña incorrectos.';return;}
    const {data:prof}=await sb.from('profiles').select('role').eq('id',d.user.id).maybeSingle();
    if(!prof||prof.role!=='manager'){ await sb.auth.signOut(); err.textContent='Esta cuenta no es de gestor.'; return; }
    boot();
  }catch(e){err.textContent='Error de conexión. Intenta de nuevo.';}
}
async function logoutManager(){ try{await sb.auth.signOut();}catch(e){} location.reload(); }
/* Si ya hay sesión de gestor, entra directo */
async function initDash(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session&&session.user){
      const {data:prof}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
      if(prof&&prof.role==='manager'){ boot(); }
    }
  }catch(e){console.warn('initDash:',e);}
}

/* ---------- KPIs ---------- */
function kpis(){
  const today=new Date().toDateString();
  const hoy=data.orders.filter(o=>new Date(o.createdAt).toDateString()===today).length;
  const ventas=data.orders.filter(o=>['en_curso','entregado'].includes(o.status)).reduce((a,o)=>a+(o.quote?o.quote.price:0),0);
  const cotizar=data.orders.filter(o=>o.status==='cotizando').length;
  const subs=Object.values(data.users).filter(activeSub).length;
  $('kpis').innerHTML=`
    <div class="kpi"><div class="v">${hoy}</div><div class="l">Pedidos hoy</div></div>
    <div class="kpi"><div class="v">${COP(ventas)}</div><div class="l">Ventas confirmadas</div></div>
    <div class="kpi or"><div class="v">${cotizar}</div><div class="l">Por cotizar</div></div>
    <div class="kpi"><div class="v">${subs}</div><div class="l">Suscriptores activos</div></div>
    <div class="kpi gr"><div class="v">${cuentas}</div><div class="l">Cuentas creadas</div></div>`;
}

/* ============================================================
   FOTOS DE PRODUCTOS — carga masiva e individual a Supabase Storage
   ============================================================ */
function normKey(s){
  s=(s||'').replace(/^\d+[_\-\s]*/,'').replace(/\.[a-z0-9]+$/i,'').replace(/_/g,' ');
  s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return s.replace(/\s+/g,' ').trim().toLowerCase();
}
/* nombre de archivo (sin pareja exacta) -> nombre de producto */
const ALIAS={
  'limon tahiti':'Limón','melon cantaloupe':'Melón','sandia':'Patilla','pitahaya':'Pithaya',
  'tamarillo':'Tomate de Árbol','mango amarillo':'Mango Azúcar','manzana royal':'Manzana Nacional',
  'pina':'Piña Golden','pina rodajas':'Piña Lebrija','uva roja':'Uva Nacional','uva verde':'Uva Importada'
};
function findProductById(id){for(const c in data.catalog){const p=(data.catalog[c]||[]).find(x=>x.id===id);if(p)return p;}return null;}
function matchProduct(filename){
  const key=normKey(filename);
  const cmp=ALIAS[key]?normKey(ALIAS[key]):key;
  for(const c in data.catalog){for(const p of data.catalog[c]){ if(p.id&&normKey(p.n)===cmp) return p; }}
  return null;
}
async function uploadOneProduct(p,file){
  const blob=await fileToJpeg(file,900,0.82);
  const path='prod-'+p.id+'.jpg';
  const {error}=await sb.storage.from('productos').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
  if(error) throw error;
  const {data:pub}=sb.storage.from('productos').getPublicUrl(path);
  await sb.from('products').update({image_url:pub.publicUrl+'?t='+Date.now()}).eq('id',p.id);
}
async function singleUpload(id){
  const fi=$('pimg-'+id); const f=fi&&fi.files&&fi.files[0]; if(!f)return;
  const p=findProductById(id); if(!p)return;
  try{ await uploadOneProduct(p,f); }catch(e){ alert('No se pudo subir la foto.'); return; }
  await refresh();
}
async function bulkUpload(){
  const fi=$('bulk-files'); const files=fi&&fi.files?Array.from(fi.files):[];
  if(!files.length){alert('Selecciona las fotos primero.');return;}
  const status=$('bulk-status'); let ok=0,fail=0; const noMatch=[];
  for(let i=0;i<files.length;i++){
    const f=files[i]; if(status) status.textContent=`Subiendo ${i+1} de ${files.length}…`;
    const p=matchProduct(f.name);
    if(!p){ noMatch.push(f.name); continue; }
    try{ await uploadOneProduct(p,f); ok++; }catch(e){ console.warn('bulk',f.name,e); fail++; }
  }
  if(status) status.textContent='';
  await refresh();
  alert('Listo.\nSubidas: '+ok+'\nFallidas: '+fail+'\nSin emparejar: '+noMatch.length+(noMatch.length?'\n - '+noMatch.join('\n - '):''));
}

/* ---------- acciones ---------- */
/* Redimensiona/comprime una imagen a JPEG antes de subirla */
async function fileToJpeg(file,maxW=1600,quality=0.82){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    let w=img.width,h=img.height;
    if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    return await new Promise(res=>c.toBlob(res,'image/jpeg',quality));
  }finally{ URL.revokeObjectURL(url); }
}
async function doQuote(id){
  const price=parseInt(($('q-'+id)||{}).value,10);
  const napa=(($('n-'+id)||{}).value||'').trim();
  const fi=$('f-'+id); const file=fi&&fi.files&&fi.files[0];
  if(!price||price<=0){alert('Ingresa un valor válido.');return;}
  if(!file){alert('Adjunta la foto de la factura para poder enviar la cotización.');return;}
  const btn=document.activeElement; if(btn&&btn.tagName==='BUTTON'){btn.disabled=true;btn.textContent='Enviando…';}
  try{
    const blob=await fileToJpeg(file);
    const path='factura-'+id+'.jpg';
    const {error:upErr}=await sb.storage.from('facturas').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
    if(upErr) throw upErr;
    const {data:pub}=sb.storage.from('facturas').getPublicUrl(path);
    const facturaUrl=pub.publicUrl+'?t='+Date.now();   // evita que el navegador muestre una foto vieja en caché
    await sb.from('orders').update({total_quoted:price,napa:napa||'Sorpresa de la casa',factura_url:facturaUrl,status:'cotizado'}).eq('id',id);
  }catch(e){
    console.warn('cotizar:',e);
    if(btn&&btn.tagName==='BUTTON'){btn.disabled=false;btn.textContent='Enviar';}
    alert('No se pudo subir la factura o guardar la cotización. Revisa tu internet e intenta de nuevo.');
    return;
  }
  await refresh();
}
async function approve(id){ try{await sb.from('orders').update({status:'en_curso'}).eq('id',id);}catch(e){alert('No se pudo aprobar.');return;} await refresh(); }
async function deliver(id){ try{await sb.from('orders').update({status:'entregado'}).eq('id',id);}catch(e){alert('No se pudo marcar entregado.');return;} await refresh(); }
async function activateSub(ph){
  const u=data.users[ph]; if(!u)return;
  const now=new Date(); const exp=new Date(now.getTime()+365*24*3600*1000);
  try{
    if(u.sub&&u.sub.id){
      await sb.from('subscriptions').update({status:'activa',starts_at:now.toISOString(),expires_at:exp.toISOString()}).eq('id',u.sub.id);
    }else{
      alert('Esta persona no tiene un pago de membresía pendiente.'); return;
    }
  }catch(e){ alert('No se pudo activar la suscripción.'); return; }
  await refresh();
}
function saveCfg(){data.cfg=data.cfg||{};data.cfg.startLat=parseFloat($('cLat').value);data.cfg.startLng=parseFloat($('cLng').value);DB.save(data);alert('Guardado.');}
function runRoute(){
  const start={lat:parseFloat($('slat').value),lng:parseFloat($('slng').value)};
  const stops=data.orders.filter(o=>o.status==='en_curso').map(o=>{const d=o.del||{};return d.coords?{id:o.id,name:uname(o.phone),lat:d.coords.lat,lng:d.coords.lng,link:d.mapsLink}:null;}).filter(Boolean);
  if(!stops.length){$('routebox').innerHTML='<div class="empty">No hay entregas con GPS para optimizar.</div>';return;}
  const{route,total}=optimize(start,stops);
  const gm=`https://www.google.com/maps/dir/${start.lat},${start.lng}/`+route.map(r=>`${r.lat},${r.lng}`).join('/');
  routeOut=`<div class="sub" style="background:#eef7ea"><b>Distancia total: ${total.toFixed(1)} km</b> <span class="tiny">— orden optimizado</span></div>
    ${route.map((r,i)=>`<div class="li"><span><b>${i+1}.</b> ${esc(r.name)} <span class="tiny">(+${r.leg.toFixed(1)} km)</span></span>${r.link?`<a class="link" target="_blank" href="${r.link}">📍</a>`:''}</div>`).join('')}
    <a class="btn btn-gd" style="display:inline-block;margin-top:10px;text-decoration:none" target="_blank" href="${gm}">Abrir ruta en Google Maps</a>`;
  $('routebox').innerHTML=routeOut;
}

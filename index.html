<style>
:root{
  --g:#34A853;        /* verde primario (canasta) */
  --gd:#1B5E20;       /* verde oscuro (Casa) */
  --gl:#7CB342;       /* verde hoja */
  --or:#F07F1A;       /* naranja (Codabas) */
  --bg:#F4F8F1;
  --card:#ffffff;
  --tx:#1f2937;
  --tl:#6b7280;
  --bd:#e6ebe3;
  --ok:#16a34a;
  --warn:#d97706;
  --shadow:0 2px 14px rgba(27,94,32,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:24px}
h1,h2,h3{margin:0}
.brand{font-weight:800;letter-spacing:-.3px}
.brand .c1{color:var(--g)}.brand .c2{color:var(--or)}.brand .c3{color:#111}
.center{text-align:center}
/* HEADER */
.hdr{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.hdr .logo{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.hdr h2{font-size:17px;font-weight:800}
.hdr small{display:block;font-size:11px;opacity:.9;font-weight:500}
.hdr .back{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
/* GENERIC */
.wrap{padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;text-align:center;transition:.15s}
.btn:active{transform:scale(.985)}
.btn-g{background:var(--g);color:#fff}
.btn-or{background:var(--or);color:#fff}
.btn-gd{background:var(--gd);color:#fff}
.btn-ghost{background:#fff;color:var(--gd);border:2px solid var(--g)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:10px 14px;font-size:14px;border-radius:10px;width:auto;display:inline-block}
label{display:block;font-size:13px;font-weight:700;color:var(--gd);margin:12px 0 5px}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--bd);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--tl);font-size:13px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill-ok{background:#e7f6ec;color:var(--ok)}
.pill-warn{background:#fef3e2;color:var(--warn)}
.pill-gray{background:#eef1ec;color:var(--tl)}
.note{background:#f0f7ed;border:1px dashed var(--gl);border-radius:10px;padding:12px;font-size:13px;color:var(--gd);margin:10px 0}
.demo{background:#fff7ed;border:1px dashed var(--or);border-radius:10px;padding:10px 12px;font-size:12px;color:#9a3412;margin:10px 0}
.err{color:#dc2626;font-size:13px;margin-top:6px}
.tabs{display:flex;background:#eef1ec;border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:none;background:none;padding:11px;border-radius:9px;font-weight:800;color:var(--tl);cursor:pointer}
.tabs button.on{background:#fff;color:var(--gd);box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* GPS */
.locbox{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer;background:#fafdf8}
.locdot{width:11px;height:11px;border-radius:50%;background:#cbd5c1;flex:none}
.locdot.ok{background:var(--ok)}
/* VALUE PROPS */
.vp{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #f0f3ed}
.vp:last-child{border-bottom:none}
.vp .ic{width:34px;height:34px;border-radius:9px;background:#eef7ea;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.vp b{color:var(--gd)}
/* CATALOG */
.catbar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.catbar button{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--tl);cursor:pointer}
.catbar button.on{background:var(--g);color:#fff;border-color:var(--g)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{border:1px solid var(--bd);border-radius:12px;padding:11px;background:#fff}
.prod .pimg{width:100%;height:100px;border-radius:8px;overflow:hidden;background:#f3f6f1;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.prod .pimg img{width:100%;height:100%;object-fit:cover}
.prod .pimg .ph{font-size:36px;opacity:.65}
.prod .nm{font-weight:700;font-size:13px;min-height:34px}
.prod .un{font-size:11px;color:var(--tl);margin-bottom:8px}
.qtyc{display:flex;align-items:center;gap:8px}
.qtyc button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:#fff;font-size:18px;font-weight:800;cursor:pointer;color:var(--gd)}
.qtyc .v{flex:1;text-align:center;font-weight:800}
.search{margin-bottom:12px}
/* CART BAR */
.cartbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:30}
.cartbar .info{flex:1}
.cartbar .info b{display:block;color:var(--gd)}
/* TRACK */
.step{display:flex;gap:12px;padding:8px 0}
.step .dot{width:26px;height:26px;border-radius:50%;background:#e6ebe3;color:var(--tl);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.step.done .dot{background:var(--ok);color:#fff}
.step.cur .dot{background:var(--or);color:#fff}
.step .lbl{font-weight:700}
.step .sub{font-size:12px;color:var(--tl)}
/* SUMMARY ITEMS */
.li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f3ed;font-size:14px}
.li:last-child{border-bottom:none}
.stars{font-size:30px;letter-spacing:6px;cursor:pointer;user-select:none}
.qr{width:170px;height:170px;margin:10px auto;border:2px dashed var(--or);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:#9a3412;font-size:12px;background:#fff7ed;flex-direction:column;gap:4px}
.mgrcard{border-left:4px solid var(--g)}
.tiny{font-size:11px;color:var(--tl)}
a.link{color:var(--g);font-weight:700;text-decoration:none}
.divider{height:1px;background:var(--bd);margin:14px 0}
.hdr .logo img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.pr{font-size:12.5px;color:var(--tl);margin:2px 0;transition:.12s}
.pr::before{content:'○ '}
.pr.ok{color:var(--ok)} .pr.ok::before{content:'✓ '}
.pr.bad{color:#dc2626} .pr.bad::before{content:'✕ '}
#pwrules.invalid{border-color:#dc2626;background:#fef2f2}
#installBar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:9999;align-items:center;gap:10px;
  background:var(--gd);color:#fff;padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 14px rgba(0,0,0,.20);font-size:14px}
#installBar #installMsg{flex:1;line-height:1.3}
#installBar #installBtn{background:#fff;color:var(--gd);border:none;border-radius:8px;padding:8px 16px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
#installBar #installClose{background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 6px;opacity:.85}
</style>
</head>
<body>

let CAT={}, CATS=[];
function loadCatalog(){
  if(!data.catalog||!Object.keys(data.catalog).length){
    data.catalog={};
    Object.keys(DEFAULT_CAT).forEach(c=>{data.catalog[c]=DEFAULT_CAT[c].map(p=>({n:p.n,u:p.u,off:false}));});
    try{DB.save(data);}catch(e){}
  }
  CAT={};
  Object.keys(data.catalog).forEach(c=>{CAT[c]=data.catalog[c].filter(p=>!p.off);});
  CATS=Object.keys(CAT).filter(c=>CAT[c].length);
  if(!CATS.includes(S.cat))S.cat=CATS[0];
}
const CAT_ORDER=['🥦 Verduras','🍎 Frutas','🥤 Pulpas','🥩 Carnes','🥛 Lácteos'];
/* Trae el catálogo real desde la tabla products de Supabase */
async function syncCatalog(){
  try{
    const {data:rows,error}=await sb.from('fresco_products').select('categoria,nombre,unidad,activo,image_url').eq('activo',true).order('nombre');
    if(error||!rows||!rows.length)return;            // si falla, se queda el catálogo por defecto
    const cat={};
    rows.forEach(r=>{const c=r.categoria||'Otros';(cat[c]=cat[c]||[]).push({n:r.nombre,u:r.unidad||'u',off:false,img:r.image_url||null});});
    const ordered={};
    CAT_ORDER.forEach(c=>{if(cat[c])ordered[c]=cat[c];});
    Object.keys(cat).forEach(c=>{if(!ordered[c])ordered[c]=cat[c];});
    data.catalog=ordered; loadCatalog(); render();
  }catch(e){console.warn('catálogo:',e);}
}
/* Unidad de un producto (para guardar en order_items) */
function unitOf(name){for(const c in data.catalog){const p=(data.catalog[c]||[]).find(x=>x.n===name);if(p)return p.u;}return '';}

const LOCALIDADES=['Usaquén','Chapinero','Suba','Barrios Unidos','Engativá','Teusaquillo','Fontibón','Santa Fe','Kennedy','Bosa','San Cristóbal','Usme','Tunjuelito','Los Mártires','Antonio Nariño','Puente Aranda','La Candelaria','Rafael Uribe Uribe','Ciudad Bolívar','Sumapaz'];

/* ---------- ALMACENAMIENTO (localStorage) ---------- */
const DB={
  load(){ try{return JSON.parse(localStorage.getItem('codabas_db'))||{users:{},orders:[],cfg:{}};}catch(e){return{users:{},orders:[],cfg:{}};} },
  save(d){ localStorage.setItem('codabas_db',JSON.stringify(d)); }
};
let data=DB.load();

/* ---------- ESTADO DE SESIÓN ---------- */
let S={
  screen:'auth', authTab:'login', phone:'', user:null,
  pendingOtp:'', otpFor:null, reg:{}, cart:{}, cat:CATS[0], search:'',
  order:null, alt:{}, altAddr:false
};

/* ---------- HELPERS ---------- */
const $=id=>document.getElementById(id);
function persist(){DB.save(data);}
function currentUser(){return S.phone?data.users[S.phone]:null;}
function userOrders(ph){return data.orders.filter(o=>o.phone===ph).sort((a,b)=>b.createdAt-a.createdAt);}
function activeSub(u){return u&&u.sub&&u.sub.active&&u.sub.expires>Date.now();}
function hasUsedFreeOrder(u){return u&&u.firstOrderUsed;}
function genOtp(){return String(Math.floor(1000+Math.random()*9000));}
function validPass(p){return /[A-Z]/.test(p)&&/[a-z]/.test(p)&&/[0-9]/.test(p)&&/[^A-Za-z0-9]/.test(p);}
function cartCount(){return Object.values(S.cart).reduce((a,b)=>a+b,0);}
function uid(){return 'P'+Date.now().toString(36)+Math.floor(Math.random()*900+100);}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function localidadOptions(sel){return ['<option value="">Selecciona…</option>'].concat(LOCALIDADES.map(l=>`<option ${l===sel?'selected':''}>${l}</option>`)).join('');}
function captureAlt(){['localidad','barrio','dir','apto','ref'].forEach(k=>{const el=$('a_'+k);if(el)S.alt[k]=el.value;});}

/* ============================================================
   CAPA DE DATOS SUPABASE (pedidos y suscripción)
   ============================================================ */
/* Convierte una fila de Supabase al formato que usan las pantallas */
function mapOrder(row){
  const fb=(row.feedback&&row.feedback.length)?row.feedback[0]:null;
  return {
    id:row.id, phone:S.phone, status:row.status,
    items:(row.order_items||[]).map(it=>({n:it.producto,qty:it.qty,u:it.unidad})),
    del:{localidad:row.localidad,barrio:row.barrio,dir:row.dir,apto:row.apto,ref:row.ref,
         coords:(row.lat!=null?{lat:row.lat,lng:row.lng}:null),mapsLink:row.maps_link},
    horario:row.horario, nota:row.nota,
    quote:(row.total_quoted!=null?{price:row.total_quoted,napa:row.napa}:null),
    facturaUrl:row.factura_url||null,
    feedback:(fb?{stars:fb.stars,text:fb.comment}:null),
    createdAt:row.created_at?new Date(row.created_at).getTime():Date.now()
  };
}
/* Carga (o recarga) los pedidos del usuario actual desde Supabase */
async function loadOrders(){
  const u=currentUser(); if(!u||!u.uid)return;
  try{
    const {data:rows,error}=await sb.from('fresco_orders')
      .select('*, fresco_order_items(*), fresco_feedback(*)').eq('user_id',u.uid)
      .order('created_at',{ascending:false});
    if(!error&&rows) data.orders=rows.map(mapOrder);
  }catch(e){console.warn('pedidos:',e);}
  startRealtime();   // activa el tiempo real una vez hay sesión (idempotente)
}
/* Carga el estado de la suscripción del usuario desde Supabase */
async function loadSub(u){
  if(!u||!u.uid)return;
  try{
    const {data:rows}=await sb.from('fresco_subscriptions').select('*')
      .eq('user_id',u.uid).order('created_at',{ascending:false}).limit(1);
    const s=rows&&rows[0];
    u.sub = s ? {
      active:(s.status==='activa'&&s.expires_at&&new Date(s.expires_at).getTime()>Date.now()),
      pending:(s.status==='pendiente'),
      expires:(s.expires_at?new Date(s.expires_at).getTime():0),
      id:s.id, status:s.status
    } : {active:false,pending:false};
  }catch(e){console.warn('suscripción:',e);}
}

/* GPS (mismo método del app actual) */
function reqGPS(target){
  const box=$('locbox');
  if(!navigator.geolocation){box.innerHTML='<div class="locdot"></div><span class="muted">GPS no disponible. Puedes continuar.</span>';return;}
  box.innerHTML='<div class="locdot"></div><span class="muted">Obteniendo ubicación…</span>';
  navigator.geolocation.getCurrentPosition(pos=>{
    const{latitude:lat,longitude:lng}=pos.coords;
    const link=`https://www.google.com/maps?q=${lat},${lng}`;
    target.coords={lat,lng}; target.mapsLink=link;
    box.innerHTML=`<div class="locdot ok"></div><div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--gd)">✓ Ubicación capturada</div><div style="font-size:11px;color:var(--tl)">${lat.toFixed(5)}, ${lng.toFixed(5)}</div></div><a href="${link}" target="_blank" class="link" style="font-size:12px">Ver →</a>`;
  },()=>{box.innerHTML='<div class="locdot"></div><span class="muted">No se pudo. Puedes continuar sin GPS.</span>';},{timeout:10000,enableHighAccuracy:true});
}

      <div class="li"><span>Estado</span><span class="pill ${o.status==='en_curso'?'pill-warn':o.status==='entregado'?'pill-ok':'pill-gray'}">${statusLabel(o.status)}</span></div>
      ${o.quote?`<div class="li"><span>Valor</span><b>${COP(o.quote.price)}</b></div><div class="li"><span>🎁 Ñapa</span><span>${esc(o.quote.napa||'Sorpresa')}</span></div>`:''}
      <div class="li"><span>Horario</span><span>${esc(o.horario)}</span></div>
    </div>
    ${facturaCard(o)}
    <div class="card">
      <h3 style="color:var(--gd);margin-bottom:6px">Seguimiento</h3>
      ${steps.map(st=>{const si=order.indexOf(st.k);const done=ci>si;const cur=o.status===st.k||(st.k==='por_confirmar'&&o.status==='pagando');
        return `<div class="step ${done?'done':''} ${cur?'cur':''}"><div class="dot">${done?'✓':si+1}</div><div><div class="lbl">${st.l}</div><div class="sub">${st.s}</div></div></div>`;}).join('')}
    </div>
    <div class="card">
      <h3 style="color:var(--gd)">Tu lista</h3>
      ${o.items.map(i=>`<div class="li"><span>${i.n}</span><b>x${i.qty}</b></div>`).join('')}
    </div>
    ${o.status==='cotizado'?`<button class="btn btn-g" data-act="open-quote">Ver cotización y pagar</button>`:''}
    ${o.status==='pagando'?`<button class="btn btn-or" data-act="open-pay">Continuar con el pago</button>`:''}
    ${o.status==='entregado'&&!o.feedback?`<button class="btn btn-g" data-act="go-feedback">Dejar mi opinión</button>`:''}
    ${o.feedback?`<div class="note">⭐ Gracias por tu opinión (${o.feedback.stars}/5).</div>`:''}
  </div>`;
}

/* ---------- FEEDBACK ---------- */
function feedbackScreen(){
  return header('¿Qué tal tu pedido?','Tu opinión nos ayuda')+
  `<div class="wrap">
    <div class="card center">
      <p>Califica tu experiencia</p>
      <div class="stars" id="stars" data-v="0">☆ ☆ ☆ ☆ ☆</div>
      <label style="text-align:left">Comentario (opcional)</label>
      <textarea id="fbtext" rows="3" placeholder="Cuéntanos qué te gustó o qué mejorar"></textarea>
      <button class="btn btn-g" data-act="send-feedback" style="margin-top:12px">Enviar opinión</button>
    </div>
  </div>`;
}

/* ============================================================
   EVENTOS
   ============================================================ */
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.authTab=b.dataset.tab;render();});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render();});
  document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const n=b.dataset.inc;S.cart[n]=(S.cart[n]||0)+1;render();});
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const n=b.dataset.dec;S.cart[n]=Math.max(0,(S.cart[n]||0)-1);if(!S.cart[n])delete S.cart[n];render();});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handle(b.dataset.act));

  const s=$('search'); if(s)s.oninput=()=>{S.search=s.value;const list=s.parentNode;render();const ns=$('search');if(ns){ns.focus();ns.setSelectionRange(ns.value.length,ns.value.length);}};
  const pwf=$('pw');
  if(pwf && S.screen==='register'){
    pwf.oninput=()=>{
      const v=pwf.value;
      const rules={'r-up':/[A-Z]/.test(v),'r-low':/[a-z]/.test(v),'r-num':/[0-9]/.test(v),'r-sp':/[^A-Za-z0-9]/.test(v)};
      let all=true;
      for(const id in rules){const el=$(id);if(el)el.className='pr '+(v?(rules[id]?'ok':'bad'):'');if(!rules[id])all=false;}
      const box=$('pwrules');if(box)box.classList.toggle('invalid',v.length>0&&!all);
    };
  }
  const stars=$('stars'); if(stars){stars.querySelectorAll;stars.onclick=e=>{const r=stars.getBoundingClientRect();const v=Math.ceil((e.clientX-r.left)/(r.width/5));stars.dataset.v=v;stars.textContent='★ '.repeat(v).trim()+' '+'☆ '.repeat(5-v).trim();};}
}

function handle(act){
  // navegación simple
  if(act==='back-auth'){S.screen='auth';return render();}
  if(act==='back-home'){S.screen='home';return render();}
  if(act==='back-catalog'){loadCatalog();S.screen='catalog';return render();}
  if(act==='go-sub'||act==='subscription'){S.screen='subscription';return render();}
  if(act==='logout')return doLogout();
  if(act==='history')return showHistory();
  if(act==='start-order'){
    loadCatalog();
    const u=currentUser();
    if(!activeSub(u)&&hasUsedFreeOrder(u)){S.screen='subscription';return render();}
    S.cart={};S.screen='catalog';return render();
  }
  if(act==='go-confirm'){S.altAddr=false;S.alt={};S.screen='confirm';return render();}
  if(act==='addr-main'){captureAlt();S.altAddr=false;return render();}
  if(act==='addr-alt'){captureAlt();S.altAddr=true;return render();}

  if(act==='go-register')return goRegister();
  if(act==='dologin')return doLogin();
  if(act==='doregister')return doRegister();
  if(act==='gps-reg')return reqGPS(S.reg);
  if(act==='gps-alt')return reqGPS(S.alt);
  if(act==='mark-sub-paid')return markSubPaid();
  if(act==='send-order')return sendOrder();
  if(act==='check-quote')return checkQuote();
  if(act==='refresh-order')return refreshOrder();
  if(act==='accept-quote')return acceptQuote();
  if(act==='reject-quote')return rejectQuote();
  if(act==='open-quote'){S.screen='quoted';return render();}
  if(act==='mark-order-paid')return markOrderPaid();
  if(act==='open-pay'){S.screen='pay';return render();}
  if(act==='go-feedback'){S.screen='feedback';return render();}
  if(act==='send-feedback')return sendFeedback();

  if(act.startsWith('reorder-'))return doReorder(act.slice(8));
  if(act.startsWith('open-')){const id=act.slice(5);S.order=data.orders.find(o=>o.id===id)||S.order;
    if(S.order.status==='cotizado')S.screen='quoted';else if(S.order.status==='pagando')S.screen='pay';else S.screen='track';return render();}
}
/* Cierra sesión también en Supabase */
async function doLogout(){ stopRealtime(); try{await sb.auth.signOut();}catch(e){} S.phone='';S.user=null;data.orders=[];S.screen='auth';render(); }
/* Refresca un pedido desde Supabase y muestra la cotización si ya está lista */
async function checkQuote(){ await loadOrders(); const f=data.orders.find(o=>o.id===S.order.id); if(f)S.order=f; if(S.order.status==='cotizado')S.screen='quoted'; render(); }
async function refreshOrder(){ await loadOrders(); const f=data.orders.find(o=>o.id===S.order.id); if(f)S.order=f; render(); }

/* ---------- TIEMPO REAL (cliente) ---------- */
let rtChannel=null, rtUid=null;
function startRealtime(){
  const u=currentUser(); if(!u||!u.uid)return;
  if(rtChannel&&rtUid===u.uid)return;          // ya suscrito para este usuario
  stopRealtime(); rtUid=u.uid;
  try{
    rtChannel=sb.channel('cli-orders-'+u.uid)
      .on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:'user_id=eq.'+u.uid}, onOrderChange)
      .subscribe();
  }catch(e){console.warn('realtime:',e);}
}
function stopRealtime(){ if(rtChannel){ try{sb.removeChannel(rtChannel);}catch(e){} } rtChannel=null; rtUid=null; }
async function onOrderChange(){
  await loadOrders();
  if(S.order){
    const f=data.orders.find(o=>o.id===S.order.id);
    if(f){ S.order=f; if(S.screen==='quoting'&&f.status==='cotizado') S.screen='quoted'; }
  }
  // solo repinta en pantallas que muestran estado del pedido (no interrumpe formularios)
  if(['quoting','quoted','pay','track','home','history'].includes(S.screen)) render();
}

/* ---------- AUTH actions ---------- */
function goRegister(){
  const ph=$('ph').value.replace(/\D/g,'');
  const err=$('autherr');
  if(ph.length<10){err.textContent='Ingresa un celular válido (10 dígitos).';return;}
  S.phone=ph;S.reg={};S.screen='register';render();
}
async function doRegister(){
  const g=id=>($(id)?$(id).value.trim():'');
  const err=$('regerr');
  const nombre=g('nombre'),apellidos=g('apellidos'),localidad=g('localidad'),barrio=g('barrio'),dir=g('dir');
  const pw=g('pw'),pw2=g('pw2');
  S.reg={...S.reg,nombre,apellidos,localidad,barrio,dir,apto:g('apto'),ref:g('ref')};
  if(!nombre||!apellidos||!dir||!barrio||!localidad){err.textContent='Completa nombres, apellidos y la dirección.';return render();}
  if(!validPass(pw)){err.textContent='La contraseña no cumple los requisitos.';return render();}
  if(pw!==pw2){err.textContent='Las contraseñas no coinciden.';return render();}
  err.textContent='Creando tu cuenta…';
  try{
    const {data:sd,error}=await sb.auth.signUp({email:phoneToEmail(S.phone),password:pw});
    if(error||!sd||!sd.user){err.textContent=error?(/registered|exists|already/i.test(error.message)?'Ese número ya tiene cuenta. Inicia sesión.':('No se pudo crear la cuenta: '+error.message)):'No se pudo crear la cuenta.';return;}
    const uid=sd.user.id;
    const del={localidad,barrio,dir,apto:g('apto'),ref:g('ref'),coords:S.reg.coords||null,mapsLink:S.reg.mapsLink||''};
    await sb.from('fresco_profiles').insert({id:uid,phone:S.phone,nombre,apellidos});
    await sb.from('fresco_addresses').insert({user_id:uid,is_primary:true,localidad,barrio,dir,apto:del.apto,ref:del.ref,lat:del.coords?del.coords.lat:null,lng:del.coords?del.coords.lng:null,maps_link:del.mapsLink});
    data.users[S.phone]={phone:S.phone,nombre,apellidos,uid,del,sub:{active:false,pending:false},firstOrderUsed:false,createdAt:Date.now()};
    persist();S.screen='home';render();
  }catch(e){err.textContent='Error de conexión. Revisa tu internet e intenta de nuevo.';}
}
async function doLogin(){
  const ph=$('ph').value.replace(/\D/g,'');const pw=$('pw').value;const err=$('autherr');
  if(ph.length<10){err.textContent='Ingresa un celular válido (10 dígitos).';return;}
  err.textContent='Entrando…';
  try{
    const {data:d,error}=await sb.auth.signInWithPassword({email:phoneToEmail(ph),password:pw});
    if(error||!d||!d.user){err.textContent='Celular o contraseña incorrectos.';return;}
    const uid=d.user.id;
    const {data:prof}=await sb.from('fresco_profiles').select('*').eq('id',uid).maybeSingle();
    const {data:addr}=await sb.from('fresco_addresses').select('*').eq('user_id',uid).eq('is_primary',true).maybeSingle();
    const prev=data.users[ph]||{};
    data.users[ph]={...prev,phone:ph,uid,
      nombre:prof?prof.nombre:prev.nombre,apellidos:prof?prof.apellidos:prev.apellidos,
      del:addr?{localidad:addr.localidad,barrio:addr.barrio,dir:addr.dir,apto:addr.apto,ref:addr.ref,coords:(addr.lat!=null?{lat:addr.lat,lng:addr.lng}:null),mapsLink:addr.maps_link}:(prev.del||{}),
      sub:prev.sub||{active:false,pending:false},firstOrderUsed:prof?!!prof.first_order_used:(prev.firstOrderUsed||false)};
    S.phone=ph;
    await loadSub(data.users[ph]);
    await loadOrders();
    persist();S.screen='home';render();
  }catch(e){err.textContent='Error de conexión. Revisa tu internet e intenta de nuevo.';}
}

/* ---------- SUSCRIPCIÓN ---------- */
async function markSubPaid(){
  const u=currentUser(); if(!u||!u.uid)return;
  if(u.sub&&u.sub.pending)return;            // evita duplicar
  try{
    await sb.from('fresco_subscriptions').insert({user_id:u.uid,status:'pendiente',tipo:'anual'});
    u.sub={...(u.sub||{}),pending:true};
  }catch(e){alert('No se pudo registrar tu pago. Revisa tu internet e intenta de nuevo.');}
  render();
}

/* ---------- PEDIDO ---------- */
async function sendOrder(){
  if(S.sending)return;
  const u=currentUser();
  const items=Object.keys(S.cart).filter(k=>S.cart[k]>0).map(n=>({n,qty:S.cart[n]}));
  if(!items.length){alert('Tu lista está vacía.');return;}
  let del=u.del;
  if(S.altAddr){
    captureAlt();
    if(!S.alt.localidad||!S.alt.barrio||!S.alt.dir){alert('Completa la dirección alterna: localidad, barrio y dirección.');return;}
    del={localidad:S.alt.localidad,barrio:S.alt.barrio,dir:S.alt.dir,apto:S.alt.apto||'',ref:S.alt.ref||'',coords:S.alt.coords||null,mapsLink:S.alt.mapsLink||''};
  }
  const horario=($('horario')?$('horario').value:''), nota=($('nota')?$('nota').value:'');
  S.sending=true;
  try{
    const {data:ins,error}=await sb.from('fresco_orders').insert({
      user_id:u.uid, status:'cotizando', horario, nota,
      localidad:del.localidad, barrio:del.barrio, dir:del.dir, apto:del.apto||'', ref:del.ref||'',
      lat:del.coords?del.coords.lat:null, lng:del.coords?del.coords.lng:null, maps_link:del.mapsLink||''
    }).select().single();
    if(error||!ins){S.sending=false;alert('No se pudo enviar el pedido. Revisa tu internet e intenta de nuevo.');return;}
    const itemRows=items.map(it=>({order_id:ins.id,producto:it.n,qty:it.qty,unidad:unitOf(it.n)}));
    await sb.from('fresco_order_items').insert(itemRows);
    if(!u.firstOrderUsed){ try{await sb.from('fresco_profiles').update({first_order_used:true}).eq('id',u.uid);}catch(e){} u.firstOrderUsed=true; }
    await loadOrders();
    S.order=mapOrder({...ins,order_items:itemRows.map(r=>({producto:r.producto,qty:r.qty,unidad:r.unidad})),feedback:[]});
    S.cart={};S.altAddr=false;S.alt={};S.screen='quoting';
  }catch(e){alert('Error de conexión. Intenta de nuevo.');}
  S.sending=false;render();
}
async function acceptQuote(){ try{await sb.from('fresco_orders').update({status:'pagando'}).eq('id',S.order.id);}catch(e){} S.order.status='pagando';S.screen='pay';render(); }
async function rejectQuote(){ try{await sb.from('fresco_orders').update({status:'cancelado'}).eq('id',S.order.id);}catch(e){} S.order.status='cancelado';S.screen='home';render(); }
async function markOrderPaid(){ try{await sb.from('fresco_orders').update({status:'por_confirmar'}).eq('id',S.order.id);}catch(e){} S.order.status='por_confirmar';S.screen='track';render(); }
async function sendFeedback(){
  const v=parseInt($('stars').dataset.v,10)||0;
  if(!v){alert('Toca las estrellas para calificar.');return;}
  const u=currentUser(); const txt=($('fbtext')?$('fbtext').value:'');
  try{ await sb.from('fresco_feedback').insert({order_id:S.order.id,user_id:u.uid,stars:v,comment:txt}); }
  catch(e){ alert('No se pudo enviar tu opinión. Intenta de nuevo.'); return; }
  S.order.feedback={stars:v,text:txt};
  S.screen='track';render();
}

/* Ver historial: recarga los pedidos desde Supabase y muestra la lista */
async function showHistory(){ await loadOrders(); S.screen='history'; render(); }
/* Volver a pedir: carga al carrito los productos (aún disponibles) de un pedido pasado */
function doReorder(id){
  const o=data.orders.find(x=>x.id===id); if(!o)return;
  const u=currentUser();
  if(!activeSub(u)&&hasUsedFreeOrder(u)){S.screen='subscription';return render();}
  loadCatalog();
  const avail=new Set(); CATS.forEach(c=>CAT[c].forEach(p=>avail.add(p.n)));
  S.cart={}; let missing=0;
  o.items.forEach(it=>{ if(avail.has(it.n)) S.cart[it.n]=it.qty; else missing++; });
  S.screen='catalog'; render();
  if(missing) alert('Algunos productos de ese pedido ya no están disponibles, así que no se agregaron. Puedes ajustar tu lista en el catálogo.');
}

/* ---------- ARRANQUE ---------- */
async function boot(){
  loadCatalog();          // pinta de inmediato con el catálogo por defecto
  syncCatalog();          // y trae el real de Supabase (re-render al llegar)
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session&&session.user){
      const uid=session.user.id;
      const {data:prof}=await sb.from('fresco_profiles').select('*').eq('id',uid).maybeSingle();
      if(prof){
        const ph=prof.phone||'';
        const {data:addr}=await sb.from('fresco_addresses').select('*').eq('user_id',uid).eq('is_primary',true).maybeSingle();
        data.users[ph]={phone:ph,uid,nombre:prof.nombre,apellidos:prof.apellidos,
          del:addr?{localidad:addr.localidad,barrio:addr.barrio,dir:addr.dir,apto:addr.apto,ref:addr.ref,coords:(addr.lat!=null?{lat:addr.lat,lng:addr.lng}:null),mapsLink:addr.maps_link}:{},
          sub:{active:false,pending:false},firstOrderUsed:!!prof.first_order_used};
        S.phone=ph;
        await loadSub(data.users[ph]);
        await loadOrders();
        S.screen='home';
      }
    }
  }catch(e){console.warn('sesión:',e);}
  render();
}
boot();

  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ---------- PWA: botón de instalar en la interfaz ---------- */
(function(){
  const ua=navigator.userAgent.toLowerCase();
  const isIOS=/iphone|ipad|ipod/.test(ua);
  const isSafari=/safari/.test(ua) && !/crios|fxios|chrome|android/.test(ua);
  const standalone=()=>window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  const dismissed=()=>{try{return localStorage.getItem('codabas_install_dismissed')==='1';}catch(e){return false;}};
  const bar=()=>$('installBar');
  let deferred=null;
  function show(){ if(standalone()||dismissed())return; const b=bar(); if(b)b.style.display='flex'; }
  function hide(){ const b=bar(); if(b)b.style.display='none'; }

  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; show(); });
  window.addEventListener('appinstalled',()=>{ deferred=null; hide(); });

  window.addEventListener('load',()=>{
    if(standalone()){ hide(); return; }
    const btn=$('installBtn'), close=$('installClose'), msg=$('installMsg');
    if(close)close.onclick=()=>{ hide(); try{localStorage.setItem('codabas_install_dismissed','1');}catch(e){} };
    if(btn)btn.onclick=async()=>{
      if(deferred){ deferred.prompt(); const r=await deferred.userChoice; deferred=null; if(r&&r.outcome==='accepted')hide(); }
      else if(isIOS){ if(msg)msg.innerHTML='📲 Toca <b>Compartir</b> (cuadro con flecha ↑) y luego <b>"Agregar a pantalla de inicio"</b>'; btn.style.display='none'; }
      else { alert('Abre el menú de tu navegador y elige "Instalar app" o "Agregar a pantalla de inicio".'); }
    };
    // iPhone (Safari) no dispara el evento automático → mostramos la barra con su instrucción al tocar
    if(isIOS && isSafari){ if(msg)msg.textContent='📲 Instala la app Fresco a tu Casa en tu iPhone'; show(); }
  });
})();
